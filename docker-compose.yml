services:
  app:
    build: .
    container_name: pstack-app
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - default
      # deploy จริงบนเซิร์ฟเวอร์ (หลัง Caddy) ให้เปิดบรรทัดล่างและลบ ports: ด้านบน
      # - odoo-public

  worker:
    build: .
    container_name: pstack-worker
    restart: unless-stopped
    # `python -m arq` ไม่ใช่ `arq` — console script ไม่มี CWD ใน sys.path จึงไป import
    # core/addons จาก site-packages (ที่ pip install ทิ้งไว้) ซึ่งไม่มี addons ย่อย
    # แล้วพังด้วย ModuleNotFoundError: No module named 'addons.users' (#4)
    command: python -m arq core.worker.WorkerSettings
    env_file: .env
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - default

  db:
    image: postgres:16-alpine
    container_name: pstack-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pstack-redis
    restart: unless-stopped
    networks:
      - default

volumes:
  pgdata:
  uploads:

networks:
  default:
    name: pstack_default
  # odoo-public:
  #   external: true
