[project]
name = "pstack"
version = "0.2.1"
description = "Modular BaaS framework on FastAPI — Odoo-style extensible modules + built-in AI agent"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "redis>=5.0",
    "arq>=0.26",
    "PyJWT>=2.8",
    "anthropic>=0.116",
    "bcrypt>=4.1",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "aiosqlite>=0.20",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "core.ai", "addons"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = [
    "BLE001",  # except Exception — ตั้งใจใช้ในจุด resilience (event bus, webhook, tool exec)
    "RUF012",  # WorkerSettings.functions เป็น convention ของ arq
    "C408",    # dict(...) อ่านง่ายกว่าในบางจุด
    "ISC004",
]

[tool.ruff.lint.per-file-ignores]
"**/__manifest__.py" = ["B018"]  # manifest คือ dict literal ลอยๆ โดยตั้งใจ
