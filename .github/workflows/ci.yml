name: CI

on:
  push:
    branches: [main]
  pull_request:

# ให้สิทธิ์น้อยที่สุด — job ไหนต้องการมากกว่านี้ค่อยประกาศเพิ่มเฉพาะ job นั้น
permissions:
  contents: read

# push รัว ๆ บน branch เดียวกัน ให้ยกเลิกรอบเก่าทิ้ง ไม่ต้องวิ่งซ้อนกัน
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Test
        run: pytest tests/ -q

      # ตรวจ CVE ที่ประกาศแล้วใน dependency ที่ติดตั้งจริง
      # --skip-editable ข้ามตัว pstack เอง (ไม่ได้อยู่บน PyPI)
      # ถ้าเจอช่องโหว่ที่ยังไม่มี fix ให้ระบุ --ignore-vuln GHSA-xxxx พร้อมคอมเมนต์ว่าทำไม
      - name: pip-audit (CVE ใน dependency)
        run: |
          pip install pip-audit
          pip-audit --skip-editable

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # gitleaks ต้องเห็นทั้ง history ไม่ใช่แค่ commit ล่าสุด

      # ใช้ CLI ผ่าน docker ไม่ใช่ gitleaks-action — action ต้องมี license สำหรับ org
      # --redact สำคัญมาก: ไม่งั้น secret ที่เจอจะถูกพิมพ์ลง log ของ Actions
      - name: gitleaks (ทั้ง git history)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            git /repo --no-banner --redact --exit-code 1

  # gate: required status check ตัวเดียวของ repo นี้คือ "ci"
  # เพิ่ม job ใหม่เมื่อไหร่ ใส่ชื่อใน needs ด้วย — branch protection ไม่ต้องแก้ตาม
  ci:
    if: always()
    needs: [test, secrets]
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        run: |
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "::error::มี job ก่อนหน้าไม่ผ่าน — ดูรายละเอียดที่ job ที่แดง"
            exit 1
          fi
          echo "ผ่านทั้งหมด"
